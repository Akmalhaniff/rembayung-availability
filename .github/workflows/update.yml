name: Update Rembayung availability

on:
  schedule:
    # Two offset lanes, still ~every 15 min combined. Avoids the exact top-of-hour
    # marks (:00/:15/:30/:45) where GitHub's scheduler queue is most congested,
    # and gives a second lane so a delayed run doesn't open a 60-min gap.
    - cron: '7,22,37,52 * * * *'
    - cron: '11,41 * * * *'
  workflow_dispatch:              # "Run workflow" button
  push:
    branches: [main]
    paths-ignore: ['availability.json', 'opened.json']   # avoid re-triggering on data commits

# Needed to publish to GitHub Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: windows-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch availability (PowerShell)
        shell: pwsh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: .\fetch-availability.ps1 -Days 14 -PartySize 3 -OutFile availability.json

      - name: Commit availability.json (for history)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add availability.json
          if git diff --cached --quiet; then
            echo "No change to availability.json"
          else
            git commit -m "data $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip netlify]"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .          # serves index.html + availability.json (static)

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
