<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rembayung Dine-In Availability</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --ok:#2ecc71; --muted:#8b93a1; --txt:#e8eaed; --accent:#e67e22; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         background:var(--bg); color:var(--txt); line-height:1.5; }
  header { padding:20px 16px 8px; text-align:center; }
  h1 { margin:0 0 4px; font-size:1.5rem; }
  .sub { color:var(--muted); font-size:.85rem; }
  main { max-width:720px; margin:0 auto; padding:12px 16px 40px; }
  .summary { text-align:center; margin:14px 0 20px; font-size:1.05rem; }
  .summary b { color:var(--ok); }
  .card { background:var(--card); border-radius:14px; padding:14px 16px; margin:10px 0;
          box-shadow:0 1px 3px rgba(0,0,0,.4); }
  .card.open { border-left:4px solid var(--ok); }
  .card.closed { opacity:.55; }
  .card .top { display:flex; justify-content:space-between; align-items:baseline; }
  .date { font-weight:600; font-size:1.1rem; }
  .day { color:var(--muted); font-size:.85rem; }
  .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; }
  .badge.yes { background:rgba(46,204,113,.15); color:var(--ok); }
  .badge.no  { background:rgba(139,147,161,.15); color:var(--muted); }
  .times { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:rgba(230,126,34,.15); color:var(--accent); border-radius:8px;
          padding:4px 10px; font-size:.9rem; }
  .book { display:inline-block; margin-top:10px; color:var(--accent); text-decoration:none; font-weight:600; }
  .empty { text-align:center; color:var(--muted); margin-top:30px; }
  footer { text-align:center; color:var(--muted); font-size:.75rem; padding:0 16px 30px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Rembayung &mdash; Dine-In Availability</h1>
  <div class="sub" id="updated">Loading&hellip;</div>
</header>
<main>
  <div class="summary" id="summary"></div>
  <div id="list"></div>
  <div class="empty" id="empty" style="display:none;">No dine-in slots open right now. Check back soon.</div>
</main>
<footer>
  Auto-updates every minute &middot; data refreshes on the server every 15 min.<br/>
  Takeaway slots are ignored &mdash; this shows <b>dine-in</b> only.
</footer>

<script>
const REFRESH_MS = 60000;

function fmtDate(s){
  const d = new Date(s + "T00:00:00");
  return d.toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' });
}

async function load(){
  try {
    const res = await fetch('availability.json', { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    render(data);
  } catch(e){
    document.getElementById('updated').textContent = 'Could not load data: ' + e.message;
  }
}

function render(data){
  document.getElementById('updated').textContent =
    'Last updated: ' + data.lastUpdated + (data.partySize ? '  ·  Party of ' + data.partySize : '');

  const dates = data.dates || [];
  const open = dates.filter(d => d.available);
  const summary = document.getElementById('summary');
  summary.innerHTML = open.length
    ? '🎉 <b>' + open.length + '</b> of ' + dates.length + ' day' + (dates.length>1?'s':'') + ' with dine-in openings'
    : 'No dine-in openings in the next ' + dates.length + ' days';

  const list = document.getElementById('list');
  list.innerHTML = '';
  document.getElementById('empty').style.display = 'none';

  dates.forEach(d => {
    const card = document.createElement('div');
    card.className = 'card ' + (d.available ? 'open' : 'closed');
    const times = (d.times || []).map(t => '<span class="chip">'+t+'</span>').join('');
    const status = d.available
      ? '<span class="badge yes">OPEN</span>'
      : '<span class="badge no">no dine-in</span>';
    const note = d.available ? '' :
      '<div class="day">Takeaway may be available — dine-in is not open yet.</div>';
    const book = d.available
      ? '<a class="book" href="'+ (data.bookingPage||'#') +'" target="_blank" rel="noopener">Book on UMAI &rarr;</a>'
      : '';
    card.innerHTML =
      '<div class="top"><span class="date">'+fmtDate(d.date)+'</span>'+ status +'</div>'+
      '<div class="day">'+ (d.day||'') +'</div>'+
      note +
      (times ? '<div class="times">'+times+'</div>' : '') +
      book;
    list.appendChild(card);
  });
}

load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
